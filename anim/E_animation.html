<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>もちもち脳内会議（案E アニメ）</title><style>
html,body{margin:0;height:100%;background:#fff5f3;overflow:hidden}
#stage{width:100vw;height:100vh;display:block}
.slot g,.slot text{transform-box:fill-box}
.pop{transform-origin:50% 100%;opacity:0;transform:scale(.01)}
.on .pop,.idle .pop{opacity:1;transform:none}
.on.popin .pop{animation:popin .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes popin{0%{opacity:0;transform:scale(.01,.01)}40%{opacity:1;transform:scale(1.15,.85)}70%{transform:scale(.93,1.08)}100%{opacity:1;transform:scale(1,1)}}
.poyon{opacity:0;transform-origin:50% 50%}
.popin .poyon{animation:poyon 1.1s ease-out both}
@keyframes poyon{0%{opacity:0;transform:translateY(10px) scale(.6)}25%{opacity:1;transform:translateY(-6px) scale(1.1)}75%{opacity:1}100%{opacity:0;transform:translateY(-30px) scale(1)}}
.bounce{transform-origin:50% 100%;animation:breathe 2.4s ease-in-out infinite}
.s1 .bounce{animation-delay:-.3s}.s2 .bounce{animation-delay:-.6s}.s3 .bounce{animation-delay:-.9s}
.s4 .bounce{animation-delay:-1.2s}.s5 .bounce{animation-delay:-1.5s;animation-duration:3s}.s6 .bounce{animation-duration:3.6s}.s7 .bounce{animation-delay:-2.1s}
.s0 .bounce{animation-duration:.9s}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-9px) scale(.98,1.03)}}
.blink{transform-origin:50% 50%;animation:blink 3.8s infinite}
.s1 .blink{animation-delay:-1s}.s4 .blink{animation-delay:-2s}.s7 .blink{animation-delay:-2.7s}.s2 .blink{animation-delay:-.5s}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.flailL{transform-origin:100% 100%;animation:flailL .45s ease-in-out infinite alternate}
.flailR{transform-origin:0% 100%;animation:flailR .45s ease-in-out infinite alternate}
@keyframes flailL{from{transform:rotate(-25deg)}to{transform:rotate(30deg)}}
@keyframes flailR{from{transform:rotate(25deg)}to{transform:rotate(-30deg)}}
.motion{animation:fade .45s steps(2) infinite}
@keyframes fade{0%{opacity:1}50%{opacity:.2}}
.flame{transform-origin:50% 100%;animation:flame .7s ease-in-out infinite alternate}
@keyframes flame{from{transform:scale(.9,1.05) skewX(-8deg)}to{transform:scale(1.1,.92) skewX(8deg)}}
.tear{animation:tear 1.2s ease-in infinite}
@keyframes tear{0%{transform:translateY(0);opacity:1}80%{transform:translateY(14px);opacity:1}100%{transform:translateY(18px);opacity:0}}
.glint{transform-origin:50% 50%;animation:glint 2.6s ease-in-out infinite}
@keyframes glint{0%,60%,100%{opacity:0;transform:scale(.4)}72%{opacity:1;transform:scale(1.1)}84%{opacity:0;transform:scale(.8)}}
.shake{animation:shake .14s linear infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3.5px)}75%{transform:translateX(3.5px)}}
.shakelines{animation:fade .5s steps(2) infinite}
.sweat1{animation:sweat 1.6s ease-in infinite}.sweat2{animation:sweat 1.6s ease-in -.8s infinite}
@keyframes sweat{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(42px);opacity:0}}
.hug{transform-origin:50% 50%;animation:hug 1.2s ease-in-out infinite}
@keyframes hug{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.fh1,.fh2,.fh3{animation:floatup 3s ease-in-out infinite}.fh2{animation-delay:-1s}.fh3{animation-delay:-2s}
@keyframes floatup{0%{transform:translateY(10px);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.harisen{transform-box:view-box!important}
.gavel{transform-box:view-box!important}
.idle .harisen,.act .harisen{animation:swing 1.1s ease-in-out infinite}
@keyframes swing{0%{transform:rotate(-20deg)}35%{transform:rotate(-30deg)}50%{transform:rotate(55deg)}62%{transform:rotate(45deg)}100%{transform:rotate(-20deg)}}
.hitfx{opacity:0}
.idle .hitfx,.act .hitfx{animation:hit 1.1s infinite}
@keyframes hit{0%,45%{opacity:0}52%{opacity:1}80%{opacity:1}90%,100%{opacity:0}}
.idle .gavel,.act .gavel{animation:bonk 1.2s ease-in-out infinite}
@keyframes bonk{0%{transform:rotate(0)}35%{transform:rotate(-35deg)}50%{transform:rotate(40deg)}60%{transform:rotate(32deg)}100%{transform:rotate(0)}}
.konfx{opacity:0}
.idle .konfx,.act .konfx{animation:hit 1.2s infinite}
.z1,.z2,.z3{opacity:0;animation:zz 3s ease-out infinite}.z2{animation-delay:1s}.z3{animation-delay:2s}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(70px,-90px)}}
.hat{transform-box:view-box!important;animation:hat 1.2s ease-in-out infinite alternate}
@keyframes hat{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.star{transform-origin:50% 50%;animation:star 1.6s ease-in-out infinite}
@keyframes star{0%,100%{transform:scale(.6) rotate(0);opacity:.5}50%{transform:scale(1.2) rotate(45deg);opacity:1}}
.bgstar{animation:fade 2.4s ease-in-out infinite}
.bub{opacity:0}
.bub.show{opacity:1}
.bub.show .bin{}
.bubin{transform-box:fill-box;transform-origin:50% 100%;animation:bubin .35s cubic-bezier(.3,1.6,.5,1) both}
@keyframes bubin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.catch{opacity:1}
.demo .catch{opacity:0}
#opts{opacity:0;pointer-events:none}
#opts.show{animation:optin .6s ease-out both}
@keyframes optin{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.optA,.optB{transform-box:fill-box;transform-origin:50% 50%}
#opts.show .optA{animation:pulse 1.6s ease-in-out .8s infinite}
#opts.show .optB{animation:pulse 1.6s ease-in-out 1.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.slot{transition:none}
.dim .pop{opacity:.35!important}
.dim .s5 .pop{opacity:1!important}
.leg{opacity:.25}
.leg.has{opacity:1}
#fadeout{opacity:0;pointer-events:none}
</style></head>

="130" rx="30" fill="#ffd9e6" stroke="#4b3a36" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="520" font-size="30" font-weight="700" fill="#4b3a36" text-anchor="middle">A　昼は誕生日、夜はデート</text><text x="450" y="568" font-size="22" font-weight="500" fill="#4b3a36" text-anchor="middle">両方行って、どっちにも全力やで</text></g><g class="optB"><rect x="740" y="470" width="520" height="130" rx="30" fill="#d6ebff" stroke="#4b3a36" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1000" y="520" font-size="30" font-weight="700" fill="#4b3a36" text-anchor="middle">B　デートは別の日に延期</text><text x="1000" y="568" font-size="22" font-weight="500" fill="#4b3a36" text-anchor="middle">誕生日を祝って、恋人にはごほうびデート</text></g></g></svg><script>
const PCT=[30, 20, 15, 15, 7, 5, 5, 3], NAMES=["\u611f\u60c5", "\u7406\u6027", "\u4e0d\u5b89", "\u611b", "\u30c4\u30c3\u30b3\u30df", "\u8b70\u9577", "\u3081\u3093\u3069\u304f\u3055\u3044", "\u30dc\u30b1"];
const HX=1700,HY=560,HR=230;
const params=new URLSearchParams(location.search);
const MODE=params.get('mode')||'demo';   // demo | idle
const MANUAL=params.has('manual');
const root=document.documentElement;
const LOOP=33.0;
const slot=i=>document.getElementById('c'+i);
let target=new Array(8).fill(0), cur=new Array(8).fill(0);
function setMap(o){target=new Array(8).fill(0);for(const k in o)target[k]=o[k];}
function on(i){const s=slot(i);s.classList.add('on','popin');}
function say(i,t){
  for(let k=0;k<8;k++){if(k!==i)hide(k);}
  const b=slot(i).querySelector('.bub');b.querySelector('.bubt').textContent=t;
  const w=b.querySelector('.bubt').getComputedTextLength()+56;
  const r=b.querySelector('.bubr');r.setAttribute('x',-w/2);r.setAttribute('width',w);
  b.classList.add('show');
  // retrigger pop
  const inner=b.querySelector('.bubi'); inner.classList.remove('bubin'); void inner.getBBox(); inner.classList.add('bubin');
}
function hide(i){const b=slot(i).querySelector('.bub');b.classList.remove('show');b.querySelector('.bubi').classList.remove('bubin');}
function act(i,on_=true){slot(i).classList.toggle('act',on_);}
function reset(){
  for(let i=0;i<8;i++){const s=slot(i);s.classList.remove('on','popin','act');hide(i);}
  document.getElementById('opts').classList.remove('show');
  document.getElementById('stage').classList.remove('dim');
  setMap({}); cur=new Array(8).fill(0);
}
const EV=[
 [0.0, ()=>reset()],
 [1.0, ()=>{on(0);setMap({0:100});}],
 [1.8, ()=>say(0,'どっちも行きたいやん！')],
 [3.6, ()=>{on(3);setMap({0:60,3:40});}],
 [4.0, ()=>say(3,'どっちも大事にしたいなぁ')],
 [5.8, ()=>say(0,'選ばれへん…泣きそうや')],
 [7.4, ()=>say(3,'不安も呼ぼうぜ！')],
 [8.4, ()=>{hide(3);on(2);setMap({0:45,3:30,2:25});}],
 [9.0, ()=>say(2,'片方怒らせたらどないしよ…')],
 [10.9,()=>say(2,'理性も呼んでや〜')],
 [11.7,()=>{hide(2);on(1);setMap({0:38,3:24,2:20,1:18});}],
 [12.2,()=>say(1,'時間ずらしたら両方いけるで')],
 [14.2,()=>{hide(1);on(7);setMap({0:35,3:22,2:18,1:18,7:7});}],
 [14.7,()=>say(7,'ほな3人で行こか〜')],
 [16.2,()=>{hide(7);on(4);setMap({0:33,3:20,2:16,1:18,7:4,4:9});act(4);}],
 [16.6,()=>say(4,'なんでやねん！')],
 [18.4,()=>{act(4,false);hide(4);on(6);setMap({0:31,3:18,2:15,1:19,7:3,4:8,6:6});}],
 [18.9,()=>say(6,'もう家で寝てたい…')],
 [20.4,()=>say(4,'寝るな！議長呼ぼか')],
 [21.6,()=>{hide(4);on(5);setMap(Object.fromEntries(PCT.map((v,k)=>[k,v])));}],
 [22.2,()=>{act(5);say(5,'ほな、整理しよか');}],
 [24.6,()=>{act(5,false);hide(5);document.getElementById('stage').classList.add('dim');document.getElementById('opts').classList.add('show');}],
 [LOOP,()=>{}],
];
let lastT=-1, evIdx=0;
function drawMap(){
  const tot=cur.reduce((a,b)=>a+b,0);
  const top=HY-HR*0.95-5, H2=HR*1.9+10;
  let y=top;
  document.querySelector('.empty').style.opacity=tot<1?1:0;
  for(let i=0;i<8;i++){
    const h=tot>0?H2*cur[i]/Math.max(tot,1e-6):0;
    const r=document.getElementById('band'+i);r.setAttribute('y',y);r.setAttribute('height',Math.max(h,0)+(h>0.5?1:0));
    const l=document.querySelector('.bl'+i);
    l.setAttribute('y',y+h/2+11);
    l.setAttribute('font-size',h>70?34:24);
    l.style.opacity=h>34?Math.min(1,(h-34)/14):0;
    y+=h;
    const g=document.getElementById('leg'+i);
    const p=tot>0?Math.round(100*cur[i]/tot):0;
    g.classList.toggle('has',target[i]>0);
    g.querySelector('.lp').textContent=p+'%';
  }
}
function step(t,dt){
  if(t<lastT){evIdx=0;}
  lastT=t;
  while(evIdx<EV.length && EV[evIdx][0]<=t){EV[evIdx][1]();evIdx++;}
  const k=1-Math.exp(-dt*3.2);
  for(let i=0;i<8;i++)cur[i]+= (target[i]-cur[i])*k;
  drawMap();
}
if(MODE==='idle'){
  root.classList.add('idle');
  target=PCT.slice();cur=PCT.slice();drawMap();
}else{
  root.classList.add('demo');
  if(!MANUAL){
    let t0=performance.now(),prev=t0;
    const loop=now=>{const t=((now-t0)/1000)%LOOP;step(t,(now-prev)/1000);prev=now;requestAnimationFrame(loop);};
    requestAnimationFrame(loop);
  }
}
// deterministic stepping for recording
let mprev=0;
window.setTime=function(ms){
  const ts=ms/1000;
  if(MODE!=='idle'){const t=ts%LOOP; step(t, Math.max(0,ts-mprev)); }
  mprev=ts;
  for(const a of document.getAnimations()){
    if(a.__s===undefined)a.__s=ms;
    a.pause(); a.currentTime=Math.max(0,ms-a.__s);
  }
};
if(MANUAL){for(const a of document.getAnimations()){a.__s=0;a.pause();}}
